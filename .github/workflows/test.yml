name: Smoke tests

# Starts the REAL launcher window on a virtual screen with fake emulators and games, then clicks through every tab,
# dialog, the launch flow, controller navigation, all themes and a small laptop screen. Separate from the build, so a
# failing test never stops the exe from being published; it just shows a red mark on the commit.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QA_OUT: ${{ github.workspace }}/test-screenshots
    steps:
      - uses: actions/checkout@v4

      - name: Install a virtual display, Tk and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-pil python3-pil.imagetk

      - name: Run the smoke tests
        run: xvfb-run -a -s "-screen 0 1400x900x24" python3 tests/run_all.py

      - name: Run the small-screen test (1024x640)
        run: xvfb-run -a -s "-screen 0 1024x640x24" python3 tests/test_08_small_screen.py

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-screenshots
          if-no-files-found: ignore
